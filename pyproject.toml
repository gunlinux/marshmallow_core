[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "marshmallow_core"
version = "0.1.10"
description = "Rust acceleration core for marshmallow serialization, installed as a separate, opt-in package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gunlinux" }]
keywords = ["marshmallow", "serialization", "rust", "performance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["marshmallow>=3.23,<5"]

[project.urls]
Homepage = "https://github.com/gunlinux/marshmallow_core"
Source = "https://github.com/gunlinux/marshmallow_core"

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[tool.ruff.lint.per-file-ignores]
# The equivalence suite groups imports beside the section they exercise.
"tests/*" = ["E402"]

[tool.pyright]
# Type-check the shipped library. The test suite subscripts marshmallow's
# loosely-typed load()/dump() results, which is inherent noise, not bugs.
include = ["python"]

[tool.maturin]
module-name = "marshmallow_core._core"
python-source = "python"
# Enables the crate's `extension-module` feature (-> `pyo3/extension-module`),
# which is off by default so `cargo test` can link libpython. See Cargo.toml.
features = ["extension-module"]
