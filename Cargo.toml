[package]
name = "marshmallow_core"
version = "0.1.0"
edition = "2021"
description = "Rust acceleration core for marshmallow serialization (separate, opt-in package)"
license = "MIT"
repository = "https://github.com/gunlinux/marshmallow_core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
# SPIKE (Design A, fused loads): jiter's pure-Rust JSON tree. We use only
# `JsonValue` (no pyo3/python feature), so there is no pyo3 version coupling.
jiter = { version = "0.15", default-features = false }

[profile.release]
lto = "thin"
