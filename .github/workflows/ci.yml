name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: code quality (lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: astral-sh/setup-uv@v5

      - name: Install dev dependencies
        run: make dev

      - name: Lint (ruff + clippy + rustfmt)
        run: make lint

      - name: Type-check (pyright)
        run: make types

  test:
    name: test (py${{ matrix.python-version }}, ma${{ matrix.marshmallow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The core supports marshmallow >=3.23; test the 3.x and 4.x lines.
        marshmallow: [">=3.23,<4", ">=4,<5"]
        include:
          # N4: pin the lowest supported 3.x endpoint so regressions at the
          # floor of the supported range are caught rather than masked by
          # ">=3.23,<4" pulling the latest patch release.
          - python-version: "3.10"
            marshmallow: "==3.23.*"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the wheel (Rust core + Python) and install it
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl
          # Pin the marshmallow line under test (the wheel allows >=3.23,<5).
          python -m pip install "marshmallow${{ matrix.marshmallow }}"

      - name: Run the suite (core active)
        run: pytest -q

      - name: Run the suite with the core disabled
        env:
          MARSHMALLOW_NO_ACCEL: "1"
        # The handshake tests assert the core is active, so exclude them here;
        # everything else must still pass on the pure-Python fallback.
        run: pytest -q -k "not core_active and not protocol"

  test-marshmallow-pre:
    # N4: run the suite against marshmallow's pre-release / development tip.
    # A diverging _do_load semantics or renamed invoker shows up here before
    # the release ships, rather than after users upgrade.  Failures don't
    # block merges (continue-on-error) but are visible in the CI summary.
    name: test (marshmallow --pre)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the wheel and install it
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl

      - name: Install marshmallow pre-release
        run: python -m pip install --pre "marshmallow>=3.23"

      - name: Run the suite (core active)
        run: pytest -q

      - name: Run the suite with the core disabled
        env:
          MARSHMALLOW_NO_ACCEL: "1"
        run: pytest -q -k "not core_active and not protocol"
